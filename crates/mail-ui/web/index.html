<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      La CSP de l'application elle-même — distincte de celle du corps d'un message, qui vient
      du démon et est posée sur l'`<iframe>`.

      `connect-src 'self'` : le front ne parle qu'au démon qui le sert, et à personne d'autre.
      C'est la moitié du critère 8 qui concerne le front lui-même — « zéro requête vers une
      destination autre que le démon ».

      `frame-src` autorise les `<iframe>` en `srcdoc`, qui héritent de l'origine du document
      parent pour cette directive : sans lui, le volet de lecture ne s'afficherait pas.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               frame-src 'self';
               form-action 'none';
               base-uri 'none'"
    />

    <title>mailcore</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
