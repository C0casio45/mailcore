[package]
name        = "mailprivacy"
description = "Les verrous de docs/PRIVACY.md : le critère 8, en deux étages, dont un dans un vrai moteur de rendu."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lib]
name = "mailprivacy"
path = "src/lib.rs"

# Un binaire et non un `#[test]`, et ce n'est pas un choix de confort : un webview veut un fil
# d'événements sur le **fil principal** du processus. Le harnais de test de Rust exécute chaque
# test sur un fil secondaire, ce qui échoue sur macOS et n'est pas garanti ailleurs.
#
# La CI le lance donc comme une étape à part entière, et son code de sortie bloque la fusion
# exactement comme un test qui tombe.
[[bin]]
name = "mailprivacy"
path = "src/main.rs"

[dependencies]
mailhtml.workspace = true

# Le vrai moteur de rendu du système : WebView2 sur Windows, WKWebView sur macOS, WebKitGTK
# sur Linux. C'est lui qui applique la CSP, et c'est lui que l'étage 2 met à l'épreuve.
wry = "0.55"
tao = "0.35"

[lints]
workspace = true
