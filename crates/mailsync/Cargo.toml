[package]
name        = "mailsync"
description = "IMAP → store. La moisson, incrémentale, en lecture seule côté serveur."

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[dependencies]
mailcore.workspace   = true
thiserror.workspace  = true
tracing.workspace    = true
mail-parser.workspace = true
camino.workspace    = true
base64.workspace    = true

# TLS obligatoire dès la connexion, ou après STARTTLS. Il n'y a pas de mode en clair dans
# `mailcore::Security`, donc pas de chemin où cette dépendance serait optionnelle.
rustls.workspace     = true
rustls-platform-verifier = "0.7"

[dev-dependencies]
mailfake.workspace = true
tempfile.workspace = true
camino.workspace   = true
tracing-subscriber.workspace = true

[lints]
workspace = true
